name: Tests

on:
  push:
    paths:
      - "Lab 3/**"
  pull_request:
    paths:
      - "Lab 3/**"

jobs:
  tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "Lab 3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
